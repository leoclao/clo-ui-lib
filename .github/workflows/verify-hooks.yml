name: Verify Hooks

on:
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & install deps
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Setup Lefthook
        run: ./scripts/setup-lefthook.sh

      - name: Run Lefthook pre-commit (npx)
        run: npx lefthook run pre-commit
